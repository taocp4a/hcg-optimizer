# Memory/time benchmark for large projects (issue #13). Not part of the workspace: run it with
# project/scripts/bench_memory.sh.
[package]
name = "hcg-bench"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hcg-bench"
path = "src/main.rs"

[dependencies]
hcg-app = { path = "../../crates/hcg-app" }
hcg-adapters = { path = "../../crates/hcg-adapters" }
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
