[workspace]
resolver = "2"
members = [
    # domain -> application -> adapters -> frontends (dependencies point inward only)
    "crates/hcg-format",
    "crates/hcg-app",
    "crates/hcg-adapters",
    "crates/hcg-cli",
    "crates/hcg-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
hcg-format = { path = "crates/hcg-format" }
hcg-app = { path = "crates/hcg-app" }
hcg-adapters = { path = "crates/hcg-adapters" }
crc32fast = "1.4"
thiserror = "2"
zip = { version = "9.3", default-features = false, features = ["deflate-flate2"] }
# Pure-Rust deflate backend for zip (builds for wasm32).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Optimize dependencies (image decoding/resizing, deflate) even in dev/test builds; our own
# crates stay unoptimized for fast compiles. Keeps the sample-image tests fast.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
